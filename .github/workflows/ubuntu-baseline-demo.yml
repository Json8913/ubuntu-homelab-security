name: Ubuntu baseline demo

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "baseline_check.sh"
      - ".github/workflows/ubuntu-baseline-demo.yml"

permissions:
  contents: read

jobs:
  baseline:
    name: Read-only baseline check
    runs-on: ubuntu-24.04
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Run and redact baseline output
        run: |
          sudo bash baseline_check.sh 2>&1 | sed -E \
            -e 's/^runner[^ ]+$/GitHub-hosted Ubuntu runner/' \
            -e 's/([0-9]{1,3}\.){3}[0-9]{1,3}/[address redacted]/g' \
            -e 's/\[[^]]+\]/[IPv6 address redacted]/g'
